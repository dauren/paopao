<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PaoPao - Tile Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="game-controls">
            <div class="game-actions">
                <button class="btn btn-primary" id="newGameBtn" title="New Game">🆕</button>
                <button class="btn btn-secondary" id="pauseBtn" title="Pause">⏸️</button>
                <button class="btn btn-secondary" id="restartBtn" title="Restart">🔄</button>
                <button class="btn btn-sound" id="soundBtn" title="Sound">🔊</button>
                <button class="btn btn-secondary" id="hintBtn" title="Hint">💡</button>
                <button class="btn btn-primary" id="solveBtn" title="Solve">✨</button>
                <button class="btn btn-secondary" id="fullscreenBtn" title="Fullscreen">⛶</button>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="game-info">
            <div class="hearts-container">
                <span class="hearts-label">❤️</span>
                <span class="hearts" id="hearts">10</span>
            </div>
            
            <div class="timer-container">
                <div class="timer-bar">
                    <div class="timer-progress" id="timerProgress"></div>
                </div>
                <span class="timer-value" id="timer">10:00</span>
            </div>
            
            <div class="score-container">
                <span class="score-value" id="score">0</span>
            </div>
        </div>
    </div>
    
    <div class="game-overlay" id="gameOverlay">
        <div class="game-overlay-content">
            <h2 id="overlayTitle">Game Over</h2>
            <p id="overlayMessage">Your result:</p>
            <div class="final-score" id="finalScore">0</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
